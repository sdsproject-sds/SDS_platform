syntax = "proto3";

package org.sds.sdslocation.grpc;

option java_multiple_files = true;
option java_package = "org.sds.sdslocation.grpc";
option java_outer_classname = "LocationProto";

service LocationService {
    rpc GetSubDivision(CoordinatesRequest) returns (SubDivisionResponse);
    rpc GetDivision(CoordinatesRequest) returns (DivisionResponse);
    rpc GetDivisionByParams(GetDivisionRequest) returns (DivisionResponse);
    rpc GeSubDivisionByParams(GetSubDivisionRequest) returns (SubDivisionResponse);
    rpc NotifyNearbyServiceProviders(NotifyNearbyRequest) returns (NotifyNearbyResponse);

}

//Search Division and Sub division request
message CoordinatesRequest {
    double latitude = 1;
    double longitude = 2;
}

// Search Division and Sub division  by is
message GetDivisionRequest{
    string divisionId = 1;
}

message GetSubDivisionRequest{
    string subDivisionId = 1;
}

// Notify nearby service request
message NotifyNearbyRequest {
    double latitude = 1;
    double longitude = 2;
    string requestId = 3;
    string requestDetails = 4;
    double radius = 5;
    repeated string serviceTypes = 6;
    map<string, string> additionalMetadata = 7;
}

// Notify nearby service response
message NotifyNearbyResponse {
    bool success = 1;
    string code = 2;
    string message = 3;
    string data = 4;
}


message SubDivisionResponse {
    bool available = 1;
    bool supported = 2;
    SubDivision subDivision = 3;
}

message SubDivision {
    string subDivisionName = 1;
    string divisionId = 2;
    string subDivisionId = 3;
    PolygonGeometry geometry = 4;
}

message DivisionResponse {
    bool available = 1;
    bool supported = 2;
    Division division = 3;
}

message Division {
    string countryCode = 1;
    string division = 2;
    string divisionId = 3;
    PolygonGeometry geometry = 4;
}

message PolygonGeometry {
    string type = 1;
    repeated LinearRing coordinates = 2;
}

message LinearRing {
    repeated Coordinate points = 1;
}

message Coordinate {
    repeated double values = 1;
}